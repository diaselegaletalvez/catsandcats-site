<!DOCTYPE html>

  <style>
    :root {
      --cream:#FFF4E0; --ink:#2B2440; --coral:#FF6B5B; --teal:#2EC4B6;
      --yellow:#FFD23F; --pink:#FF7FB6; --purple:#9B5DE5;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:"Nunito",sans-serif; color:var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(255,210,63,.45), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(46,196,182,.4), transparent 42%),
        var(--cream);
      min-height:100vh; display:grid; place-items:center; padding:40px 20px;
      -webkit-font-smoothing:antialiased;
    }
    .box { text-align:center; max-width:520px; }
    .num {
      font-family:"Fredoka"; font-weight:700; font-size:clamp(70px,16vw,130px);
      line-height:1; color:var(--coral); letter-spacing:2px;
    }
    .cat { width:clamp(170px,40vw,230px); height:auto; margin:6px auto 10px; display:block;
      filter:drop-shadow(0 16px 22px rgba(43,36,64,.22)); }
    h1 { font-family:"Fredoka"; font-weight:700; font-size:clamp(24px,5vw,34px); margin-top:8px; }
    p { font-size:17px; font-weight:600; color:#5d5470; margin:14px auto 0; max-width:400px; line-height:1.6; }
    .btn {
      display:inline-block; margin-top:26px; font-family:"Fredoka"; font-weight:600; font-size:18px;
      padding:15px 38px; border-radius:999px; border:none; color:#fff;
      background:var(--coral); box-shadow:0 6px 0 #d8503f; transition:transform .12s;
    }
    .btn:hover { transform:translateY(-3px); }
    .links { margin-top:22px; font-weight:700; }
    .links a { color:var(--purple); text-decoration:none; }
    .links a:hover { text-decoration:underline; }
    .sep { color:#c9bda3; margin:0 8px; }
  </style>
</head>
