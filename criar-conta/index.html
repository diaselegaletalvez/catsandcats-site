<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — Cats &amp; Cats</title>
  <meta name="description" content="Crie sua conta na Cats & Cats para comprar e ler seus quadrinhos.">
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --cream:#FFF4E0; --ink:#2B2440; --coral:#FF6B5B; --teal:#2EC4B6; --line:#efe4cf; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:"Nunito",sans-serif; background:var(--cream); color:var(--ink);
      min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
    a { color:inherit; }
    h1,h2 { font-family:"Fredoka",sans-serif; }

    .topbar { display:flex; align-items:center; justify-content:space-between;
      padding:14px 5vw; background:#fff; border-bottom:3px solid var(--line); }
    .logo { display:flex; align-items:center; gap:8px; font-family:"Fredoka"; font-weight:700; font-size:20px; color:var(--coral); text-decoration:none; }
    .logo svg { width:24px; height:24px; }
    .top-link { font-family:"Fredoka"; font-weight:600; font-size:14px; color:var(--ink); text-decoration:none;
      background:var(--cream); padding:8px 16px; border-radius:999px; border:2px solid var(--line); }

    .wrap { flex:1; display:grid; place-items:center; padding:40px 20px; }
    .card { width:100%; max-width:440px; background:#fff; border-radius:24px;
      box-shadow:0 18px 44px rgba(43,36,64,.12); padding:38px clamp(24px,5vw,40px); }
    .card h1 { font-size:28px; text-align:center; }
    .card .sub { text-align:center; font-weight:600; color:#6a6180; margin:10px 0 24px; font-size:15px; }

    .campo { margin-bottom:16px; }
    .campo label { display:block; font-family:"Fredoka"; font-weight:600; font-size:14px; margin-bottom:6px; }
    .campo input { width:100%; font-family:"Nunito"; font-weight:600; font-size:16px;
      padding:13px 16px; border:2px solid var(--line); border-radius:14px; background:#fffdf8; color:var(--ink); }
    .campo input:focus { outline:none; border-color:var(--coral); }

    .btn { width:100%; font-family:"Fredoka"; font-weight:600; font-size:18px; color:#fff;
      background:var(--coral); border:none; border-radius:999px; padding:15px; cursor:pointer;
      box-shadow:0 6px 0 #d8503f; transition:transform .12s; margin-top:6px; }
    .btn:hover { transform:translateY(-2px); }
    .btn:disabled { opacity:.6; cursor:default; transform:none; }

    .msg { margin-top:14px; font-weight:700; font-size:14px; text-align:center; min-height:20px; }
    .msg.err { color:#c0392b; }
    .msg.ok { color:#1f9d8f; }

    .foot-link { text-align:center; margin-top:20px; font-weight:600; color:#6a6180; font-size:14px; }
    .foot-link a { color:var(--coral); font-weight:700; text-decoration:none; }
    .termos { text-align:center; margin-top:16px; font-size:12px; color:#9a93ab; line-height:1.5; }
    .termos a { color:#6a6180; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="11" r="2.1"/><circle cx="9.5" cy="7.4" r="2.2"/><circle cx="14.5" cy="7.4" r="2.2"/><circle cx="18.5" cy="11" r="2.1"/><path d="M12 12.4c2.8 0 5 2 5 4.3 0 1.7-1.6 2.4-3.2 1.9-1.1-.4-2.5-.4-3.6 0-1.6.5-3.2-.2-3.2-1.9 0-2.3 2.2-4.3 5-4.3z"/></svg>
      Cats &amp; Cats
    </a>
    <a class="top-link" href="/painel/">Já tenho conta</a>
  </header>

  <main class="wrap">
    <div class="card">
      <h1>Criar conta</h1>
      <p class="sub">Uma conta só dá acesso aos dois mundos — Kids e Adulto.</p>

      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" autocomplete="name" placeholder="Seu nome" />
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" autocomplete="email" placeholder="voce@email.com" />
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="new-password" placeholder="Mínimo 6 caracteres" />
      </div>
      <div class="campo">
        <label for="senha2">Confirmar senha</label>
        <input type="password" id="senha2" autocomplete="new-password" placeholder="Repita a senha" />
      </div>

      <button class="btn" id="btnCriar">Criar conta</button>
      <div class="msg" id="msg"></div>

      <p class="foot-link">Já tem conta? <a href="/painel/">Entrar</a></p>
      <p class="termos">Ao criar a conta, você concorda com os
        <a href="/termos.html">Termos</a> e a <a href="/privacidade.html">Privacidade</a>.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var SB_URL = 'https://urguoedgajhykkczatcx.supabase.co';
    var SB_KEY = 'sb_publishable_53he8rq2bdCmlEVyHf0Q3Q_Mnl1jim_';
    var sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;

    var btn = document.getElementById('btnCriar');
    var msg = document.getElementById('msg');

    function emailValido(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

    async function criarConta() {
      msg.className = 'msg';
      var nome = document.getElementById('nome').value.trim();
      var email = document.getElementById('email').value.trim();
      var senha = document.getElementById('senha').value;
      var senha2 = document.getElementById('senha2').value;

      if (!email || !senha || !senha2) { msg.className = 'msg err'; msg.textContent = 'Preencha e-mail e senha.'; return; }
      if (!emailValido(email)) { msg.className = 'msg err'; msg.textContent = 'Digite um e-mail válido.'; return; }
      if (senha.length < 6) { msg.className = 'msg err'; msg.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
      if (senha !== senha2) { msg.className = 'msg err'; msg.textContent = 'As senhas não são iguais.'; return; }
      if (!sb) { msg.className = 'msg err'; msg.textContent = 'Não foi possível conectar. Tente recarregar a página.'; return; }

      var orig = btn.textContent;
      btn.textContent = 'Criando...'; btn.disabled = true;
      try {
        var res = await sb.auth.signUp({
          email: email,
          password: senha,
          options: { data: { nome: nome } }
        });
        if (res.error) {
          var m = (res.error.message || '').toLowerCase();
          if (m.indexOf('already') !== -1 || m.indexOf('registered') !== -1 || m.indexOf('exists') !== -1) {
            msg.className = 'msg err'; msg.textContent = 'Esse e-mail já tem conta. Tente entrar.';
          } else {
            msg.className = 'msg err'; msg.textContent = 'Não foi possível criar a conta: ' + res.error.message;
          }
          btn.textContent = orig; btn.disabled = false;
          return;
        }
        // Sucesso
        if (res.data && res.data.session) {
          // Confirmação de e-mail desligada: já está logado -> vai pro painel
          msg.className = 'msg ok'; msg.textContent = 'Conta criada! Entrando...';
          setTimeout(function () { window.location.href = '/painel/'; }, 900);
        } else {
          // Confirmação de e-mail ligada: precisa confirmar
          msg.className = 'msg ok';
          msg.textContent = 'Conta criada! Confirme seu e-mail (verifique a caixa de entrada) e depois faça login.';
          btn.textContent = 'Conta criada';
        }
      } catch (e) {
        msg.className = 'msg err'; msg.textContent = 'Erro ao criar a conta. Tente de novo.';
        btn.textContent = orig; btn.disabled = false;
      }
    }

    btn.addEventListener('click', criarConta);
    document.getElementById('senha2').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') criarConta();
    });
  </script>
</body>
</html>
