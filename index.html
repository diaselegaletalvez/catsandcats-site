<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cats &amp; Cats — Escolha seu mundo</title>
<meta name="description" content="Cats & Cats: quadrinhos físicos e digitais. Escolha entre o Mundo Kids e o Mundo Adulto.">
<meta property="og:title" content="Cats & Cats — Quadrinhos">
<meta property="og:description" content="Quadrinhos físicos e digitais. Escolha seu mundo: Kids ou Adulto.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://catsandcats.com.br/">
<meta property="og:image" content="https://catsandcats.com.br/gato-mascote.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Albert+Sans:wght@400;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#FFF4E0; --ink:#1a1a1a; --muted:#777; --line:#e8ddc8;
    --coral:#FF6B5B; --pink:#FF7FB6; --yellow:#FFD23F; --teal:#2EC4B6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Albert Sans",system-ui,sans-serif;background:var(--cream);
    color:var(--ink);min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:32px 20px;
  }
  a{text-decoration:none;color:inherit}
  .logo{
    font-family:"Fraunces",serif;font-weight:700;font-size:34px;color:var(--coral);
    display:flex;align-items:center;gap:8px;margin-bottom:6px;
  }
  .tagline{font-family:"Fraunces",serif;font-size:20px;color:var(--ink);margin-bottom:38px;font-weight:500}
  .cards{display:flex;gap:24px;width:100%;max-width:860px}
  .card{
    flex:1;border-radius:28px;padding:40px 28px;text-align:center;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    transition:transform .18s, box-shadow .18s;text-decoration:none;
    min-height:340px;justify-content:center;
  }
  .card:hover{transform:translateY(-8px)}
  .card .emoji{font-size:78px;line-height:1}
  .card h2{font-size:30px;line-height:1.1}
  .card p{font-size:15px;font-weight:600;max-width:240px;opacity:.92}
  .enter{
    margin-top:8px;font-family:"Fredoka",sans-serif;font-weight:600;font-size:17px;
    padding:12px 28px;border-radius:999px;
  }
  /* Kids */
  .kids{
    background:radial-gradient(circle at 70% 20%,rgba(255,210,63,.55),transparent 45%),
               linear-gradient(135deg,var(--coral),var(--pink));
    color:#fff;box-shadow:0 14px 30px rgba(255,107,91,.35);
  }
  .kids h2{font-family:"Fredoka",sans-serif;font-weight:700}
  .kids .enter{background:#fff;color:var(--coral)}
  /* Adulto */
  .adulto{
    background:linear-gradient(135deg,#2b2b2b,#0d0d0d);
    color:#f2f2f2;box-shadow:0 14px 30px rgba(0,0,0,.3);
  }
  .adulto h2{font-family:"Fraunces",serif;font-weight:600}
  .adulto .enter{background:#fff;color:#111}
  footer{margin-top:42px;font-size:13px;color:var(--muted);text-align:center}
  footer a{margin:0 8px}
  footer a:hover{color:var(--ink)}
  @media (max-width:680px){
    .cards{flex-direction:column}
    .card{min-height:auto;padding:34px 24px}
  }
</style>
</head>
<body>
  <div class="logo"><span>🐾</span> Cats &amp; Cats</div>
  <div class="tagline">Escolha seu mundo 🐱</div>

  <div class="cards">
    <a class="card kids" href="/kids/">
      <div class="emoji">😺</div>
      <h2>Mundo Kids</h2>
      <p>Quadrinhos coloridos e divertidos pra criançada se aventurar!</p>
      <span class="enter">Entrar →</span>
    </a>

    <a class="card adulto" href="/adulto/">
      <div class="emoji">📖</div>
      <h2>Mundo Adulto</h2>
      <p>Histórias e quadrinhos para leitores adultos.</p>
      <span class="enter">Entrar →</span>
    </a>
  </div>

  <footer>
    <a href="/intro">Nossa história</a> ·
    <a href="/suporte.html">Suporte</a> ·
    <a href="/privacidade.html">Privacidade</a> ·
    <a href="/termos.html">Termos</a>
    <div style="margin-top:8px">© 2026 Cats &amp; Cats 🐾</div>
  </footer>
</body>
</html>
